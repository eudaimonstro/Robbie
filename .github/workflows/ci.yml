name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; only publish writes, to the package registry
permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Pushes to main each get a group of
# their own (by commit), so none is canceled and each green commit is published
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast feedback: format, lint, types, the audit and the build, without a database
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate -w backend-node

      - name: Audit the production dependencies
        # Fails on high or critical findings; the moderate ones it prints are
        # accepted in docs/security/dependency-audit.md
        run: npm audit --omit=dev -w backend-node -w shared -w frontend-unified --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        # ESLint fails on any warning (--max-warnings 0), then the palette check
        run: npm run lint

      - name: Type-check shared
        run: npx tsc --noEmit -p shared/tsconfig.json

      - name: Type-check backend-node
        run: npx tsc --noEmit -p backend-node/tsconfig.json

      - name: Type-check frontend-unified
        run: npx tsc --noEmit -p frontend-unified/tsconfig.json

      - name: Type-check the Playwright harness
        run: npx tsc --noEmit -p e2e/tsconfig.json

      - name: Build all
        run: npm run build

  # The unit tests of the three packages, with coverage and its thresholds
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NODE_ENV=test is set on the test steps only: Vite reads NODE_ENV, and with it set to test
    # a web build bundles React's development build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate -w backend-node

      - name: Test shared
        run: npm run test:coverage -w shared
        env:
          NODE_ENV: test

      - name: Test backend-node
        run: npm run test:coverage -w backend-node
        env:
          NODE_ENV: test

      - name: Test frontend-unified
        run: npm run test:coverage -w frontend-unified
        env:
          NODE_ENV: test

  # The migrations against the schema, and backend-node's integration tests on Postgres
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robbie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robbie
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/robbie
      # The same database as DATABASE_URL: this job's Postgres is a throwaway service. Locally
      # INTEGRATION_DATABASE_URL never points at DATABASE_URL's database (CLAUDE.md)
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robbie
      # Reset by the drift check; created below
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robbie_shadow

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate -w backend-node

      - name: Check the migrations match the schema
        # Applies the migrations to a shadow database and compares the result with
        # schema.prisma: a schema change without its migration (or the reverse) fails here
        working-directory: backend-node
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/robbie" -c 'CREATE DATABASE robbie_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Apply database migrations
        run: npm run db:deploy -w backend-node

      - name: Integration tests backend-node
        run: npm run test:integration:coverage -w backend-node
        env:
          NODE_ENV: test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robbie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # This job's own Postgres service; locally the harness uses the throwaway one on 55432
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robbie
    # NODE_ENV=test only on the Playwright step, not the web build (see the unit job)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate -w backend-node

      - name: Build the web app
        run: npm run build -w frontend-unified

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright
        run: npx playwright test -c e2e
        env:
          NODE_ENV: test

      - name: Upload screenshots and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: robbie:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it from compose, check it, and restore a backup into it
        run: bash deploy/smoke.sh robbie:ci

  publish:
    # Only main, and only once everything else passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, unit, integration, e2e, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # One publish at a time; a later push's publish waits for this one
    concurrency:
      group: publish-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Name the commit's tags
        id: tag
        # :main moves only to the commit at the tip of main. Once main has moved on, a later
        # push's publish moves it (or already has, if its tests finished first), so this commit
        # gets only its sha- tag and never puts :main back on an older build
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "main=ghcr.io/eudaimonstro/robbie:main" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $tip now, so :main stays where it is"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.main }}
            ghcr.io/eudaimonstro/robbie:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
