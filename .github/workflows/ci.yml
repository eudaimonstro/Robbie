name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robbie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robbie
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/robbie
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robbie
    # NODE_ENV=test is set on the test steps only: Vite reads NODE_ENV, and with it set to test
    # the web build bundles React's development build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate -w backend-node

      - name: Apply database migrations
        run: npm run db:deploy -w backend-node

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check shared
        run: npx tsc --noEmit -p shared/tsconfig.json

      - name: Type-check backend-node
        run: npx tsc --noEmit -p backend-node/tsconfig.json

      - name: Type-check frontend-unified
        run: npx tsc --noEmit -p frontend-unified/tsconfig.json

      - name: Type-check mobile
        run: npx tsc --noEmit -p mobile/tsconfig.json

      - name: Test shared
        run: npm run test:run -w shared
        env:
          NODE_ENV: test

      - name: Test backend-node
        run: npm run test:run -w backend-node
        env:
          NODE_ENV: test

      - name: Integration tests backend-node
        run: npm run test:integration -w backend-node
        env:
          NODE_ENV: test

      - name: Test frontend-unified
        run: npm run test:run -w frontend-unified
        env:
          NODE_ENV: test

      - name: Test mobile
        run: npm run test:run -w mobile
        env:
          NODE_ENV: test

      - name: Build all
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robbie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # This job's own Postgres service; locally the harness uses the throwaway one on 55432
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robbie
    # NODE_ENV=test only on the Playwright step, not the web build (see the ci job)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate -w backend-node

      - name: Build the web app
        run: npm run build -w frontend-unified

      - name: Type-check the harness
        run: npx tsc --noEmit -p e2e/tsconfig.json

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright
        run: npx playwright test -c e2e
        env:
          NODE_ENV: test

      - name: Upload screenshots and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14
