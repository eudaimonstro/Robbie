[build]
builder = "RAILPACK"
watchPatterns = ["../shared/**", "./**", "../package.json", "../package-lock.json"]
buildCommand = "cd .. && rm -rf node_modules package-lock.json && npm install && npm run build -w shared && npm run build -w frontend"

[deploy]
startCommand = "npx serve dist -s -l tcp://0.0.0.0:$PORT"
healthcheckPath = "/"
healthcheckTimeout = 100
