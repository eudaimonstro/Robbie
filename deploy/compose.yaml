# Robbie in production (docs/deploy.md): the app, its database, nightly backups and Caddy for
# HTTPS. Run every command from this directory: docker compose up -d, docker compose logs -f
# app. The settings are in .env, copied from .env.production.example.
name: robbie

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  app:
    image: ${ROBBIE_IMAGE:-ghcr.io/eudaimonstro/robbie:main}
    # The fallback when the image can't be pulled: docker compose build app (needs the swap file)
    build:
      context: ..
    restart: unless-stopped
    env_file: ${ROBBIE_ENV_FILE:-.env}
    # These win over .env
    environment:
      NODE_ENV: production
      PORT: '3001'
      # Caddy is the one proxy in front (it replaces any X-Forwarded-For a client sends)
      TRUST_PROXY: '1'
      UPLOAD_DIR: /data/uploads
      # Files preserved after a report, by handleReport.js (docs/deploy.md, "Handling a report")
      PRESERVE_DIR: /data/preserved
      DATABASE_URL: postgresql://robbie:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/robbie
    volumes:
      - uploads:/data/uploads
      - preserved:/data/preserved
    depends_on:
      db:
        condition: service_healthy
    # The server closes its sockets, writes the live meetings' last changes and closes the
    # database pool on SIGTERM, in a second or two (10 at most). An init process passes SIGTERM
    # on while app-start is still migrating (a shell as PID 1 ignores it, so docker stop would
    # wait out the grace period and kill it)
    init: true
    stop_grace_period: 15s
    # The box has 1.9 GiB for the app, Postgres, Caddy and the system. Node's heap is capped at
    # 384 MB (app-start); the rest is buffers, compression and Node itself. A 150-phone meeting
    # peaks near 400 MB. Past the limit the container restarts rather than pushing the whole box
    # into swap, and phones join again by themselves.
    mem_limit: 768m
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: robbie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: robbie
    # Never published: only the app (and the backup service) reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U robbie -d robbie']
      interval: 5s
      timeout: 5s
      retries: 10
    # Default settings (128 MB of shared buffers) and at most 10 connections from the app's one
    # pool, plus the backups
    mem_limit: 512m
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # The loop is a shell, which ignores SIGTERM as PID 1; an init stops it promptly
    init: true
    entrypoint: ['/bin/sh', '/scripts/backup.sh']
    command: ['loop']
    environment:
      PGHOST: db
      PGUSER: robbie
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: robbie
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-9}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_OWNER: ${BACKUP_OWNER:-}
    volumes:
      - ./backup.sh:/scripts/backup.sh:ro
      - ./restore.sh:/scripts/restore.sh:ro
      - uploads:/data/uploads
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ROBBIE_DOMAIN: ${ROBBIE_DOMAIN:-robbie.scouch.dev}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:
  uploads:
  # Reported material and its manifests: the app only. Never mounted into the backup service, so
  # never in a backup, and never deleted within a year of each report (docs/deploy.md)
  preserved:
  # Caddy's certificates and account: keep them, or Let's Encrypt's rate limits may bite
  caddy_data:
  caddy_config:
