[build]
builder = "RAILPACK"
watchPatterns = ["../shared/**", "./**", "../package.json", "../package-lock.json"]
buildCommand = "cd .. && rm -rf node_modules package-lock.json && npm install && npm run build -w shared && npm run build -w backend"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
