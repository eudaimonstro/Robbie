[build]
builder = "RAILPACK"
watchPatterns = ["../shared/**", "src/**", "package.json", "../package.json"]
buildCommand = "cd .. && npm install && npm run build -w shared && npm run build -w backend"

[deploy]
startCommand = "cd .. && npm run start -w backend"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
